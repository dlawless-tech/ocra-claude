            - generic [ref=e1393]:
              - paragraph [ref=e1394]: In Week 16, two of the four designated matchups will be played on Saturday at 4:30 PM ET and 8:00 PM ET on NFL Network, with the remainder to be played either on Thursday night (8:15 PM ET), Sunday afternoon (1:00 PM ET and 4:25 PM ET), Sunday night (8:20 PM ET), or Monday night (8:15 PM ET). Specific dates and start times for the designated Week 16 matchups will be determined and announced at a later date during the season, no later than immediately after Week 14.
              - paragraph [ref=e1395]: In Week 17, two of the four designated matchups will be played on Saturday at 4:30 PM ET on NBC and 8:00 PM ET on Peacock, with the remainder to be played either on Thursday night (8:15 PM ET), Sunday afternoon (1:00 PM ET and4:25 PM ET), Sunday night (8:20 PM ET), or Monday night (8:15 PM ET). Specific dates and start times for the designated Week 17 matchups will be determined and announced at a later date during the season, no later than immediately after Week 15.
              - paragraph [ref=e1396]: In Week 18, three games will be played on Saturday (1:00 PM ET on Netflix, 4:30 PM ET and 8:00 PM ET on ESPN/ABC) with the remainder to be played on Sunday afternoon (1:00 PM ET and 4:25 PM ET), or Sunday night (8:20 PM ET). Specific dates, start times, and networks for Week 18 matchups will be determined and announced following the conclusion of Week 17.
